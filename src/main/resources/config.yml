# QuantumMending 설정
# 변경 후 서버를 재시작하거나 /minecraft:reload 를 실행하면 적용됩니다.

# 수선(Mending)의 최대 레벨 (1 ~ 255, 바닐라는 1)
max-level: 5

# 경험치 1당 회복하는 내구도
#   레벨 N의 수리량 = base + per-level * (N - 1)
#   기본값: I=2(바닐라와 동일), II=4, III=6, IV=8, V=10
repair-per-xp:
  base: 2.0
  per-level: 2.0

# 모루 비용 계수 (바닐라는 4)
#   모루에서 붙일 때 드는 레벨 = anvil-cost * 결과 레벨 (책으로 붙이면 절반)
#   0이면 인챈트 자체 비용 없이 작업 패널티만 듭니다.
anvil-cost: 4
