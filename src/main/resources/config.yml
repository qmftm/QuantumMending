# QuantumMending 설정
# 변경 후 /qm reload 로 다시 불러올 수 있습니다.
# 단, max-level, repair-per-xp, anvil-cost, enchanting-table.weight 는 서버를 재시작해야 적용됩니다.

# 수선(Mending)의 최대 레벨 (1 ~ 255, 바닐라는 1)
max-level: 5

# 경험치 1당 회복하는 내구도
#   레벨 N의 수리량 = base + per-level * (N - 1)
#   기본값: I=2(바닐라와 동일), II=4, III=6, IV=8, V=10
repair-per-xp:
  base: 2.0
  per-level: 2.0

# 모루 비용 계수 (바닐라는 4)
#   모루에서 붙일 때 드는 레벨 = anvil-cost * 결과 레벨 (책으로 붙이면 절반)
#   0이면 인챈트 자체 비용 없이 작업 패널티만 듭니다.
anvil-cost: 4

# 구조물 상자, 주민 거래, 낚시 등에서 나오는 수선의 최대 레벨 (1 ~ max-level)
#   이 값을 넘는 레벨이 나오면 1 ~ 이 값 사이에서 다시 뽑습니다.
#   1이면 바닐라처럼 항상 I이 나오고, 높은 레벨은 모루로만 만들 수 있습니다.
loot:
  max-level: 1

# 인챈트 테이블
enchanting-table:
  # 인챈트 테이블에서 수선이 뜨는지 여부 (바닐라는 false)
  enabled: false
  # 뽑힐 확률 가중치 (1 ~ 1024, 바닐라 수선 2 / 참고: 보호 10, 내구성 5, 섬세한 손길 1)
  #   다른 인챈트 가중치와의 상대값입니다. 실제 확률은 README 표를 참고하세요.
  weight: 2
  # 인챈트 테이블에서 나오는 수선의 최대 레벨 (1 ~ max-level)
  max-level: 1
